name: Rabbitech regression checks

on:
  pull_request:
    paths:
      - "index.html"
      - "assets/js/mobile-dock.js"
      - "assets/css/mobile-dock.css"
      - "scripts/check-rabbitech.mjs"
      - ".github/workflows/rabbitech-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Static regression checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run regression checks
        run: node scripts/check-rabbitech.mjs
