name: Telegram bot checks

on:
  pull_request:
    paths:
      - 'api/telegram-webhook.js'
      - 'tests/telegram-webhook.test.js'
      - 'assets/js/mobile-dock.js'
      - 'supabase/migrations/*telegram*'
      - '.github/workflows/telegram-bot-checks.yml'
  push:
    branches: [main]
    paths:
      - 'api/telegram-webhook.js'
      - 'tests/telegram-webhook.test.js'
      - 'assets/js/mobile-dock.js'
      - 'supabase/migrations/*telegram*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - run: node --check api/telegram-webhook.js
      - run: node --check assets/js/mobile-dock.js
      - run: node --test tests/telegram-webhook.test.js
